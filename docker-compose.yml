version: '3.8'

services:
  packing-service:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - stowage_db_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/stowage.db
    restart: unless-stopped

volumes:
  stowage_db_data:
    name: stowage_db_data
